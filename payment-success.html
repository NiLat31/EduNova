<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Payment Successful | EduNova</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f7f7f7;
            font-family: Arial, sans-serif;
        }

        .success-card {
            width: min(90%, 520px);
            background: white;
            padding: 50px 35px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.08);
        }

        .check {
            font-size: 60px;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0 0 15px;
            font-size: 32px;
            color: #111;
        }

        p {
            color: #666;
            line-height: 1.6;
            font-size: 16px;
        }

        .status {
            margin-top: 25px;
            font-weight: 600;
            color: #111;
        }

        .dashboard-button {
            display: none;
            margin-top: 25px;
            padding: 14px 24px;
            background: #111;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <div class="success-card">

        <div class="check">✓</div>

        <h1>Payment Successful</h1>

        <p>
            Thank you for purchasing EduNova Premium.
        </p>

        <div class="status" id="status">
            Confirming your payment...
        </div>

        <a
            href="dashboard.html"
            class="dashboard-button"
            id="dashboard-button"
        >
            GO TO DASHBOARD
        </a>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const SUPABASE_URL =
            "https://majvqtbortonsrgdknms.supabase.co";

        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_J3xbJWRcBIei3PLPg9GG3Q_JAjemfD_";

        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY
            );

        async function confirmPayment() {

            const status =
                document.getElementById("status");

            const dashboardButton =
                document.getElementById("dashboard-button");

            const params =
                new URLSearchParams(window.location.search);

            const orderId =
                params.get("token");

            if (!orderId) {
                status.textContent =
                    "We couldn't find the PayPal order.";
                return;
            }

            try {

                const {
                    data: { session }
                } = await supabaseClient.auth.getSession();

                if (!session) {
                    status.textContent =
                        "Please log in again to activate your Premium access.";
                    return;
                }

                const { data, error } =
                    await supabaseClient.functions.invoke(
                        "capture-paypal-order",
                        {
                            body: {
                                order_id: orderId
                            }
                        }
                    );

                if (error) {
                    console.error(error);
                    throw new Error(
                        "Payment confirmation failed."
                    );
                }

                if (!data || !data.premium_access) {
                    throw new Error(
                        "Premium access could not be activated."
                    );
                }

                status.textContent =
                    "Your Premium access is now active!";

                dashboardButton.style.display =
                    "inline-block";

            } catch (error) {

                console.error(error);

                status.textContent =
                    "We couldn't confirm your payment. Please try again.";
            }
        }

        confirmPayment();
    </script>

</body>
</html>
